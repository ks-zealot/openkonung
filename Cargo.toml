[package]
name = "openkonung"
version = "0.1.0"
edition = "2021"
description = "Browser port of the OpenKonung playable prototype (original Konung 1.03 data)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bincode = "1.3"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }

# Native-only: the packer (examples/pack.rs) writes ZIP archives. It is a
# target-specific dependency so the wasm module never links a writer.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
